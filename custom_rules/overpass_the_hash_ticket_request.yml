title: Overpass-the-Hash - Kerberos TGT Request Following NTLM Hash Use
id: 8d9e0f1a-2b3c-4d4e-9f5a-6b7c8d9e0f1a
status: experimental
description: |
    Detects a Kerberos AS-REQ (TGT request) immediately preceded by an NTLM
    hash being supplied to a logon session, the pattern left by "overpass-
    the-hash" (a.k.a. pass-the-key), where a stolen NTLM hash is used to
    request a legitimate Kerberos ticket rather than authenticating via NTLM
    directly - allowing the attacker to bypass NTLM-specific detections while
    still moving laterally on a stolen credential.
references:
    - https://attack.mitre.org/techniques/T1550/002/
    - https://attack.mitre.org/techniques/T1558/
author: mcp-hayabusa sample rules
date: 2026-07-12
tags:
    - attack.lateral-movement
    - attack.credential-access
    - attack.t1550.002
logsource:
    product: windows
    service: security
    definition: 'Requires Kerberos Authentication Service auditing (Event ID 4768) to be enabled'
detection:
    selection:
        EventID: 4768
        PreAuthType: '2'  # encrypted timestamp pre-auth, expected for a normal password-based TGT
        TicketEncryptionType: '0x17'  # RC4-HMAC: typical when the "password" supplied is really an NTLM hash
    filter_service_accounts:
        TargetUserName|endswith: '$'
    condition: selection and not filter_service_accounts
falsepositives:
    - Legacy clients or service accounts still configured to use RC4 for Kerberos pre-authentication
level: medium
