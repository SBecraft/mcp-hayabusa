title: Potential Kerberoasting via RC4 Service Ticket Request
id: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
status: experimental
description: |
    Detects Kerberos service ticket (TGS) requests using the weaker RC4-HMAC
    encryption type (0x17), which is the pattern produced when a tool such as
    Rubeus or PowerView requests tickets for accounts with an SPN in order to
    crack the ticket offline (Kerberoasting), especially at unusually high
    volume from a single account.
references:
    - https://attack.mitre.org/techniques/T1558/003/
    - https://github.com/GhostPack/Rubeus
author: mcp-hayabusa sample rules
date: 2026-07-12
tags:
    - attack.credential-access
    - attack.t1558.003
logsource:
    product: windows
    service: security
    definition: 'Requires Kerberos Service Ticket Operations auditing (Event ID 4769) to be enabled'
detection:
    selection:
        EventID: 4769
        TicketEncryptionType: '0x17'
    filter_machine_accounts:
        ServiceName|endswith: '$'
    filter_krbtgt:
        ServiceName: 'krbtgt'
    condition: selection and not 1 of filter_*
falsepositives:
    - Legacy applications or service accounts that only support RC4 encryption
    - Environments that have not enforced AES for Kerberos service tickets
level: medium
