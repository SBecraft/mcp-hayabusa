title: LSASS Memory Dump via comsvcs.dll MiniDump
id: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e70
status: experimental
description: |
    Detects use of the built-in comsvcs.dll MiniDump export (via rundll32)
    to dump the memory of the LSASS process to disk, a living-off-the-land
    alternative to dropping a dedicated credential-dumping tool.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://www.hackingarticles.in/credential-dumping-comsvcs-dll/
author: mcp-hayabusa sample rules
date: 2026-07-12
tags:
    - attack.credential-access
    - attack.t1003.001
    - attack.defense-evasion
    - attack.t1218.011
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\rundll32.exe'
    selection_cmd:
        CommandLine|contains: 'comsvcs.dll'
    selection_export:
        CommandLine|contains:
            - 'MiniDump'
            - '#24'
    condition: all of selection_*
falsepositives:
    - Rare legitimate administrative use of comsvcs.dll for unrelated COM diagnostics
level: critical
