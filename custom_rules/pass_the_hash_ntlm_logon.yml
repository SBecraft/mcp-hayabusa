title: Pass-the-Hash via Suspicious NTLM Network Logon
id: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
status: experimental
description: |
    Detects a network (Logon Type 3) logon authenticating via NTLM where the
    calling process is a known lateral-movement or credential-theft tool
    (e.g. Mimikatz's "sekurlsa::pth", Impacket's wmiexec/psexec), the pattern
    left behind by pass-the-hash attacks that authenticate using a stolen
    NTLM hash instead of a plaintext password.
references:
    - https://attack.mitre.org/techniques/T1550/002/
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_logon_ntlm.yml
author: mcp-hayabusa sample rules
date: 2026-07-12
tags:
    - attack.lateral-movement
    - attack.defense-evasion
    - attack.t1550.002
logsource:
    product: windows
    service: security
    definition: 'Requires Logon auditing (Event ID 4624) with process/package fields populated'
detection:
    selection:
        EventID: 4624
        LogonType: 3
        AuthenticationPackageName: 'NTLM'
    selection_tool_process:
        ProcessName|endswith:
            - '\mimikatz.exe'
            - '\wmiexec.py'
            - '\psexec.py'
            - '\PsExec.exe'
    filter_anonymous:
        TargetUserName: 'ANONYMOUS LOGON'
    condition: selection and selection_tool_process and not filter_anonymous
falsepositives:
    - Legitimate remote administration tools authenticating via NTLM in environments without Kerberos
level: high
