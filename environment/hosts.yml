# Known hosts and their roles in this environment.
# Used to give detection/response context (e.g. is this host a DC? a workstation?
# does it normally see privileged authentication traffic?).
domain: insecurebank.local
hosts:
  - hostname: DC1.insecurebank.local
    role: domain_controller
    criticality: critical
    os: Windows Server 2019
    ip: 10.0.1.10
    notes: Primary domain controller, holds all FSMO roles.
  - hostname: DC2.insecurebank.local
    role: domain_controller
    criticality: critical
    os: Windows Server 2019
    ip: 10.0.1.11
    notes: Secondary domain controller.
  - hostname: FS1.insecurebank.local
    role: file_server
    criticality: high
    os: Windows Server 2019
    ip: 10.0.1.20
    notes: Hosts shared drives for the finance and HR departments.
  - hostname: WEB1.insecurebank.local
    role: web_server
    criticality: critical
    os: Windows Server 2019
    ip: 10.0.2.10
    notes: Internet-facing customer banking portal.
  - hostname: WS-FINANCE-03
    role: workstation
    criticality: medium
    os: Windows 11
    ip: 10.0.10.43
    notes: Finance department workstation; user has wire-transfer approval access.
  - hostname: WS-HELPDESK-07
    role: workstation
    criticality: high
    os: Windows 11
    ip: 10.0.10.107
    notes: IT helpdesk workstation; account has local admin rights on most endpoints via helpdesk tooling, making it a high-value lateral-movement target despite being "just a workstation."
